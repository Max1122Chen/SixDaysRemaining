# ============================================================================
#  六日英雄 WebGL —— nginx 托管配置（Brotli 预压缩版）
#  用法：把本文件内容并入你的 nginx 配置（或直接用本文件启动 nginx），
#        然后把 root 指向 WebGL 构建目录（即含 index.html / Build / StreamingAssets 的那一层）。
# ============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # Unity WebGL 需要、但 mime.types 里通常没有的两类
    types {
        application/wasm        wasm;
        application/octet-stream data mem;
    }

    # server 侧再次压缩（只影响没有预压缩产物的文件，例如 index.html / loader.js）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/octet-stream;

    server {
        listen       80;
        server_name  _;

        # ↓↓↓ 改成你的 WebGL 构建目录 ↓↓↓
        root  /var/www/sixdays-webgl;
        index index.html;

        # ------------------------------------------------------------------
        # 1) Unity 的加载器请求的是“未压缩名”：
        #      Build/WebGL.data  Build/WebGL.wasm  Build/WebGL.framework.js
        #    而构建产物实际叫 *.br。这里优先取同名 .br，取不到就回退原文件。
        # ------------------------------------------------------------------
        location ~ ^(?<unity_plain>.+\.(js|wasm|data|mem))$ {
            try_files /$unity_plain.br /$unity_plain =404;
        }

        # ------------------------------------------------------------------
        # 2) .br 文件：声明 Content-Encoding，并按“原始扩展名”给出正确 MIME。
        #    注意 Content-Type 必须正确：若 framework.js.br 以 octet-stream 返回，
        #    浏览器的 nosniff 策略会拒绝执行脚本。
        # ------------------------------------------------------------------
        location ~ \.js\.br$ {
            add_header Content-Encoding br always;
            add_header Vary Accept-Encoding always;
            default_type application/javascript;
        }

        location ~ \.wasm\.br$ {
            add_header Content-Encoding br always;
            add_header Vary Accept-Encoding always;
            default_type application/wasm;
        }

        location ~ \.(data|mem)\.br$ {
            add_header Content-Encoding br always;
            add_header Vary Accept-Encoding always;
            default_type application/octet-stream;
        }

        # ------------------------------------------------------------------
        # 3) 视频：不要压缩（mp4 本身已压缩），并保证支持 Range 请求，
        #    否则浏览器无法边下边播 21MB 的 backstory.mp4。
        # ------------------------------------------------------------------
        location ~* \.(mp4|webm|m4a|mp3|ogg)$ {
            gzip  off;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # 4) 其余静态文件（json / html / png ...）
        location / {
            try_files $uri $uri/ =404;
        }
    }
}